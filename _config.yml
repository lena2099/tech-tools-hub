title: Tech & Tools Hub
description: AI tools, productivity, remote work, and honest tech reviews
url: https://lena2099.github.io/tech-tools-hub
author:
  name: Lena

remote_theme: jekyll/minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

include:
  - _chapters
  - _premium
  - fiction

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      author: Lena

minima:
  social_links:
    - { platform: devto, user_url: "https://dev.to/lena2099" }
# Google Analytics 4
google_analytics: G-XXXXXXXXXX
