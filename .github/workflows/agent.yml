name: Athena v3 — Generate + SEO + Distribute

on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pyyaml

      # ── Stage 1: Generate + SEO (one commit) ──
      - name: 🤖 Generate Article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/agent.py

      - name: ✍️ Humanize Article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/humanizer.py

      - name: 🔍 SEO Engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/seo_engine.py

      - name: 🔗 Affiliate Link Check
        run: python .github/scripts/affiliate_check.py

      - name: 💾 Commit Article + SEO
        run: |
          git config user.name "Athena Bot"
          git config user.email "bot@athena.local"
          git add _posts/ sitemap.xml robots.txt _config.yml
          if git diff --staged --quiet; then
            echo "No changes — already published this cycle"
          else
            git commit -m "🤖+🔍 Auto: new article + SEO ($(date -u +%Y-%m-%d_%H:%M))"
            git push
          fi

      # ── Stage 2: Distribution ──
      - name: 📡 Distribute (IndexNow + Bluesky + Dev.to)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python .github/scripts/dist_engine.py

      - name: 💾 Commit Distribution Report
        run: |
          git add _dist/
          if git diff --staged --quiet; then
            echo "No distribution changes"
          else
            git commit -m "📡 Dist: cross-post report ($(date -u +%Y-%m-%d_%H:%M))"
            git push
          fi
