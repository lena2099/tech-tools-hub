name: Athena — Auto Article Generator

on:
  schedule:
    - cron: '30 */4 * * *'   # Every 4 hours at :30
  workflow_dispatch:           # Manual trigger for testing

permissions:
  contents: write              # Allow pushing commits

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pyyaml

      - name: Generate Article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python .github/scripts/agent.py

      - name: Commit & Push
        run: |
          git config user.name "Athena Bot"
          git config user.email "bot@athena.local"
          git add _posts/ sitemap.xml robots.txt
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "🤖 Auto: new article $(date -u +%Y-%m-%d_%H:%M)"
            git push
          )
